<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We've Moved!</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      
      text-align: center;
      padding: 20px;
    }
    h1 { color: #26ccf5; margin-bottom: 10px; }
    p { color: rgba(255,255,255,0.8); margin-bottom: 30px; }
    a.btn {
      background: #26ccf5;
      color: black;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: filter 0.2s ease;
    }
    a.btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <h1>I've Upgraded My Portfolio!</h1>
  <p>This site has moved to a new home. Click below to check it out.</p>
  <a class="btn" href="https://your-project.vercel.app" target="_blank" rel="noreferrer">
    Go to New Website
  </a>
</body>
</html>
